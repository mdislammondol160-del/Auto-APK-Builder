name: Auto APK Builder

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Download Gradle Wrapper & Build
        run: |
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk          </manifest>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/clean/builder/MainActivity.java
          package com.clean.builder;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = new WebView(this);
                  setContentView(w);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

         - name: Download User Website/ZIP
     run: |
       cd app/src/main/assets
       wget -O downloaded_file "https://raw.githubusercontent.com/mdn/beginner-html-site-styled/master/index.html"
       if unzip -q downloaded_file; then
         rm downloaded_file
       else
         mv downloaded_file index.html
       fi

          if unzip -q downloaded_file; then
            rm downloaded_file
          else
            mv downloaded_file index.html
          fi

      - name: Build APK using Gradle
        run: gradle assembleDebug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: My-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
